services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db
    environment:
      ORACLE_PASSWORD: "${ORACLE_PASSWORD:-OracleRoot123}"
      APP_USER: "APP_USER"
      APP_USER_PASSWORD: "${APP_USER_PASSWORD:-AppPassword123}"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - challenge_net
    restart: unless-stopped

  jornadapet:
    build: .
    image: jornadapet-oracle:local
    container_name: jornadapet-app
    depends_on:
      oracle-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:oracle:thin:@oracle-db:1521/XEPDB1"
      SPRING_DATASOURCE_USERNAME: "APP_USER"
      SPRING_DATASOURCE_PASSWORD: "${APP_USER_PASSWORD:-AppPassword123}"
      # Obrigatórias: a aplicação não sobe sem elas (jwt.secret e app.admin.bootstrap-key não têm padrão)
      JWT_SECRET: "${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}"
      ADMIN_BOOTSTRAP_KEY: "${ADMIN_BOOTSTRAP_KEY:?Defina ADMIN_BOOTSTRAP_KEY no arquivo .env}"
    networks:
      - challenge_net
    restart: on-failure

networks:
  challenge_net:
    driver: bridge

volumes:
  oracle_data:
