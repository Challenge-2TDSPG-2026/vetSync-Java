spring.application.name=VetSync

# ===== Banco de dados: Oracle FIAP =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:RM562085}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Pool de conexões Hikari (limitado para respeitar a cota SESSIONS_PER_USER do Oracle FIAP)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-migration-naming=true

spring.cache.type=simple

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

jwt.secret=${JWT_SECRET:9a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b}
jwt.expiration=86400000

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:dev@vetsync.com}
spring.mail.password=${MAIL_PASSWORD:devpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.remetente=${MAIL_USERNAME:dev@vetsync.com}
app.link.base-url=${LINK_BASE_URL:https://vetsync-theta.vercel.app}

app.admin.bootstrap-key=${ADMIN_BOOTSTRAP_KEY:boot-secret-dev-12345}

# Carteira de vacinação compartilhável (QR Code / link público)
app.carteira-compartilhada.expiracao-dias=${CARTEIRA_COMPARTILHADA_EXPIRACAO_DIAS:30}

server.port=8080

# Upload de imagens (ex.: imagem de produto no catálogo de recompensas)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB