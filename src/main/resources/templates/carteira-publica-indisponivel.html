<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Link indisponível</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f2f5f3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1f2a24;
            padding: 24px;
        }
        .aviso {
            max-width: 400px;
            text-align: center;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 32px 24px;
        }
        .aviso h1 { font-size: 18px; margin: 0 0 8px; }
        .aviso p { font-size: 14px; color: #6b756f; margin: 0; line-height: 1.5; }
    </style>
</head>
<body>
<div class="aviso">
    <h1>Este link não está disponível</h1>
    <p>Ele pode ter expirado, sido revogado, ou nunca ter existido. Peça ao tutor do pet um novo link, se necessário.</p>
</div>
</body>
</html>
