spring.application.name=VetSync-Test

# Database H2 in-memory with Oracle compatibility mode
spring.datasource.url=jdbc:h2:mem:vetsynctest;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Disable Flyway for unit and slice tests
spring.flyway.enabled=false

# Disable MockData seed in test
app.mockdata.enabled=false

spring.cache.type=simple

# JWT configuration for tests (valid 256-bit key)
jwt.secret=9a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b
jwt.expiration=86400000

# Admin bootstrap key
app.admin.bootstrap-key=boot-secret-test-key-12345

# Convites de acesso a pets
app.convite.web-invite-url=https://vetsync.test/convite
app.convite.expiracao-horas=72

# Mail configuration
app.mail.remetente=test@vetsync.com
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
